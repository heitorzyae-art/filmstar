[package]
name = "filmstar-cli"
description = "FilmStar headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "filmstar-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["filmstar-engine/whisper", "filmstar-engine/speech-download"]

[dependencies]
filmstar-engine = { workspace = true }
filmstar-export = { workspace = true }
filmstar-project = { workspace = true }
filmstar-render = { workspace = true }
filmstar-time = { workspace = true }
filmstar-gpu = { workspace = true }
filmstar-media = { workspace = true }
filmstar-codecs = { workspace = true }
filmstar-platform = { workspace = true }
filmstar-mxf = { workspace = true }
filmstar-mpegts = { workspace = true }
filmstar-ogg = { workspace = true }
filmstar-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
filmstar-testkit = { workspace = true }
