[package]
name = "filmstar-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmstar-color = { workspace = true }
filmstar-frame = { workspace = true }
filmstar-geom = { workspace = true }
filmstar-project = { workspace = true }
filmstar-render = { workspace = true }
filmstar-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "1"
rayon = { workspace = true }

[dev-dependencies]
pollster = "1"
filmstar-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
filmstar-media = { workspace = true }
filmstar-time = { workspace = true }
