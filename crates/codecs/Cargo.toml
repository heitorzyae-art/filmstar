[package]
name = "filmstar-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmstar-time = { workspace = true }
filmstar-color = { workspace = true }
filmstar-frame = { workspace = true }
filmstar-media = { workspace = true }
filmstar-avi = { workspace = true }
filmstar-isobmff = { workspace = true }
filmstar-matroska = { workspace = true }
filmstar-mxf = { workspace = true }
filmstar-mpegts = { workspace = true }
filmstar-mpeg2v = { workspace = true }
filmstar-ac3 = { workspace = true }
filmstar-mpa = { workspace = true }
filmstar-ogg = { workspace = true }
filmstar-bitstream = { workspace = true }
filmstar-h264 = { workspace = true }
filmstar-hevc = { workspace = true }
filmstar-vp8 = { workspace = true }
filmstar-vp9 = { workspace = true }
filmstar-prores = { workspace = true }
filmstar-dnx = { workspace = true }
filmstar-av1 = { workspace = true }
filmstar-apv = { workspace = true }
filmstar-aac = { workspace = true }
filmstar-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
filmstar-testkit = { workspace = true }
serde_json = { workspace = true }
