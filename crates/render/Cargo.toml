[package]
name = "filmstar-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmstar-time = { workspace = true }
filmstar-geom = { workspace = true }
filmstar-color = { workspace = true }
filmstar-frame = { workspace = true }
filmstar-media = { workspace = true }
filmstar-project = { workspace = true }
filmstar-audio-dsp = { workspace = true }
filmstar-captions = { workspace = true }
filmstar-text = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
