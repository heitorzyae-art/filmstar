[package]
name = "filmstar-tts"
description = "FilmStar text to speech: the Voice trait, the voice catalogue, script parsing (pause markers), the built-in formant voice and (feature kokoro) Kokoro-82M neural voices on candle"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Kokoro-82M neural voices on the CPU via candle (pure Rust). Off by default and in wasm builds.
kokoro = ["dep:candle-core", "dep:candle-nn", "dep:zip", "dep:serde_json", "dep:sha2", "dep:filmstar-tts-text", "dep:filmstar-audio-dsp"]

[dependencies]
filmstar-tts-text = { workspace = true, optional = true }
filmstar-audio-dsp = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
candle-core = { version = "0.11", default-features = false, optional = true }
candle-nn = { version = "0.11", default-features = false, optional = true }
zip = { version = "9", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true }

[[example]]
name = "kokoro_say"
required-features = ["kokoro"]

[[example]]
name = "narrate"
required-features = ["kokoro"]
