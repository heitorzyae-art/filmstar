[package]
name = "filmstar-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmstar-time = { workspace = true }
filmstar-frame = { workspace = true }
filmstar-color = { workspace = true }
filmstar-media = { workspace = true }
filmstar-project = { workspace = true }
filmstar-render = { workspace = true }
filmstar-audio-dsp = { workspace = true }
filmstar-geom = { workspace = true }
filmstar-text = { workspace = true }
filmstar-isobmff = { workspace = true }
filmstar-prores = { workspace = true }
filmstar-dnx = { workspace = true }
filmstar-apv = { workspace = true }
filmstar-mxf = { workspace = true }
filmstar-aac = { workspace = true }
filmstar-flac = { workspace = true }
filmstar-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
filmstar-testkit = { workspace = true }
filmstar-codecs = { workspace = true }
